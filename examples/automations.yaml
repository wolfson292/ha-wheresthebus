# WheresTheBus — example automations
#
# Six automations: four banner alerts, one iOS Live Activity spanning the whole
# journey, and a reminder to re-sync Live Activities after an app update.
#
# Before using, replace:
#   RIDER          your rider's entity slug, e.g. jane_smith
#                  (Settings > Devices & Services > WheresTheBus > the device)
#   NOTIFY_TARGET  your notify service, e.g. notify.mobile_app_janes_iphone
#                  or a notify group covering everyone who should be told
#   /school-bus/overview
#                  the path to your dashboard, if you renamed it
#
#   sed -i '' -e 's/RIDER/jane_smith/g' -e 's/NOTIFY_TARGET/notify.mobile_app_x/g' \
#     automations.yaml
#
# Then paste into automations.yaml, or create each via
# Settings > Automations > three-dots > Edit in YAML.
#
# The time windows below bracket a 07:56 and 17:48 timetable. Change them to
# straddle your own scheduled stop times — they matter more than they look:
# buses routinely pass a stop on unrelated earlier routes, and without the
# windows those passes fire every position-based alert. On the route these
# were written against, the bus sat at the stop at 06:13 before an 07:56
# pickup, every single day.
#
# Needs Home Assistant 2026.7+ for the Live Activity automations. The banner
# alerts work on any version that has the integration.

# ---------------------------------------------------------------------------
# 1. Ten minutes out, from the learned prediction
# ---------------------------------------------------------------------------
# A native time trigger on a timestamp sensor with a negative offset — no
# templates, no polling. Held silent until the run has been learned: anchored
# to the timetable instead, this fired 8 minutes AFTER the bus had been and
# gone, which is worse than no alert at all.
- id: wtb_bus_10_min
  alias: School bus — 10 minutes away
  mode: single
  triggers:
    - trigger: time
      at:
        entity_id: sensor.RIDER_next_arrival
        offset: "-00:10:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: sensor.RIDER_next_arrival
      attribute: prediction_source
      state: learned
    # A duration, not an instantaneous check. bus_status reports GPS
    # freshness, not whether a bus is running: it flaps between current and
    # stale every minute or two and drops to inactive during any GPS gap. On
    # one morning it went inactive at 07:31 and back to current at 07:46:10,
    # and the alert due at 07:46:00 was blocked by ten seconds. Only a
    # sustained outage should count as no service.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.RIDER_bus_status
          state: inactive
          for: "00:30:00"
        - condition: state
          entity_id: sensor.RIDER_bus_status
          state: unavailable
          for: "00:30:00"
  actions:
    - action: NOTIFY_TARGET
      data:
        title: School bus
        message: >-
          10 minutes from {{ 'the stop' if
          state_attr('sensor.RIDER_next_arrival', 'run') == 'am' else 'home' }}
          — around {{ (states('sensor.RIDER_next_arrival') | as_datetime |
          as_local).strftime('%-I:%M %p') }}.
        data:
          tag: school-bus
          url: /school-bus/overview
          clickAction: /school-bus/overview
          push:
            interruption-level: time-sensitive
            sound: default

# ---------------------------------------------------------------------------
# 2. Five minutes out, from the learned prediction
# ---------------------------------------------------------------------------
- id: wtb_bus_5_min
  alias: School bus — 5 minutes away
  mode: single
  triggers:
    - trigger: time
      at:
        entity_id: sensor.RIDER_next_arrival
        offset: "-00:05:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: sensor.RIDER_next_arrival
      attribute: prediction_source
      state: learned
    # A duration, not an instantaneous check. bus_status reports GPS
    # freshness, not whether a bus is running: it flaps between current and
    # stale every minute or two and drops to inactive during any GPS gap. On
    # one morning it went inactive at 07:31 and back to current at 07:46:10,
    # and the alert due at 07:46:00 was blocked by ten seconds. Only a
    # sustained outage should count as no service.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.RIDER_bus_status
          state: inactive
          for: "00:30:00"
        - condition: state
          entity_id: sensor.RIDER_bus_status
          state: unavailable
          for: "00:30:00"
  actions:
    - action: NOTIFY_TARGET
      data:
        title: School bus
        message: >-
          5 minutes from {{ 'the stop' if
          state_attr('sensor.RIDER_next_arrival', 'run') == 'am' else 'home' }}
          — around {{ (states('sensor.RIDER_next_arrival') | as_datetime |
          as_local).strftime('%-I:%M %p') }}.
        data:
          tag: school-bus
          url: /school-bus/overview
          clickAction: /school-bus/overview
          push:
            interruption-level: time-sensitive
            sound: default

# ---------------------------------------------------------------------------
# 3. Closing in — the fallback while a run is still unlearned
# ---------------------------------------------------------------------------
# Position-based, so it needs no history. Active only while the prediction is
# still the timetable, then steps aside so it never duplicates alert 2.
- id: wtb_bus_closing_in
  alias: School bus — closing in
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.RIDER_distance_to_stop
      below: 1.2
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: or
      conditions:
        - condition: time
          after: "07:20:00"
          before: "08:40:00"
        - condition: time
          after: "17:10:00"
          before: "18:40:00"
    - condition: state
      entity_id: sensor.RIDER_next_arrival
      attribute: prediction_source
      state: scheduled
    # A duration, not an instantaneous check. bus_status reports GPS
    # freshness, not whether a bus is running: it flaps between current and
    # stale every minute or two and drops to inactive during any GPS gap. On
    # one morning it went inactive at 07:31 and back to current at 07:46:10,
    # and the alert due at 07:46:00 was blocked by ten seconds. Only a
    # sustained outage should count as no service.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.RIDER_bus_status
          state: inactive
          for: "00:30:00"
        - condition: state
          entity_id: sensor.RIDER_bus_status
          state: unavailable
          for: "00:30:00"
    # Once per run. numeric_state re-arms when the value climbs back above the
    # threshold, and buses wander past the stop again after pulling away.
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or (now() -
        this.attributes.last_triggered).total_seconds() > 10800 }}
  actions:
    - action: NOTIFY_TARGET
      data:
        title: School bus
        message: >-
          Getting close — {{ states('sensor.RIDER_distance_to_stop') }} miles
          from the stop.
        data:
          tag: school-bus
          url: /school-bus/overview
          clickAction: /school-bus/overview
          push:
            interruption-level: time-sensitive
            sound: default

# ---------------------------------------------------------------------------
# 4. Arriving now — observed position, never a prediction
# ---------------------------------------------------------------------------
# The most reliable of the four, because it cannot be wrong about where the bus
# actually is. Measured about a minute of warning at 0.3 miles; widen the
# threshold if you want longer. Rename it after your own street.
- id: wtb_bus_arriving
  alias: School bus — arriving now
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.RIDER_distance_to_stop
      below: 0.3
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: or
      conditions:
        - condition: time
          after: "07:20:00"
          before: "08:40:00"
        - condition: time
          after: "17:10:00"
          before: "18:40:00"
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or (now() -
        this.attributes.last_triggered).total_seconds() > 10800 }}
  actions:
    - action: NOTIFY_TARGET
      data:
        title: School bus
        message: Turning onto your street — arriving at the stop now.
        data:
          tag: school-bus
          url: /school-bus/overview
          clickAction: /school-bus/overview
          push:
            interruption-level: time-sensitive
            sound: default

# ---------------------------------------------------------------------------
# 5. Live Activity — one activity across the whole journey
# ---------------------------------------------------------------------------
# This reads sensor.RIDER_journey. It does not work the journey out again.
#
# It used to be ten branches, each deciding for itself whether a journey was
# under way and how far through it was, from whatever signals were nearest to
# hand. Four faults came out of the gaps between them:
#
#   * the morning bar filled for two hours after the rider reached school,
#     because
#     that branch's only stop was a scan the school skips two days in three;
#   * the bar lurched between 78% and 7%, because two branches measured
#     progress on different scales;
#   * the title and colour flickered, because they were chosen in two places
#     that disagreed;
#   * the countdown ran 61 hours to the following Monday, because one branch
#     never checked its target was still today.
#
# None was a hard problem. Each was a gap in one branch that the other nine
# could not see, in a place with no way to test it. The integration already
# held the scans, the live distance, the learned windows and both predictions,
# so it answers the question once and this presents the answer.
#
# What is left below is presentation: stage to wording, stage to colour, and
# one push. No dates, no windows, no run attributes, no elapsed-time
# arithmetic — the four things that went wrong.
#
# Needs the integration's journey sensor (2.1.0+) and, for iOS, Home Assistant
# 2026.7+ with iOS 17.2 or later.
- id: wtb_bus_live
  alias: School bus — Live Activity
  mode: queued
  max: 10
  trace:
    stored_traces: 30
  variables:
    j: sensor.RIDER_journey
    stage: "{{ states(j) }}"
    # The tag IS the journey id, so a push can never update yesterday's
    # activity, and one that fails to start leaves nothing wedged behind.
    jid: "{{ state_attr(j, 'journey_id') }}"
    progress: "{{ state_attr(j, 'progress') }}"
    target: "{{ state_attr(j, 'target') }}"
    dist: "{{ states('sensor.RIDER_distance_to_stop') }}"
    mins: "{{ ((target | as_timestamp - as_timestamp(now())) / 60) | round | int if target else 0 }}"
    due: "{{ (target | as_datetime | as_local).strftime('%-I:%M %p') if target else '' }}"
    title: >-
      {{ {'to_stop': 'Bus on the way to the stop', 'at_stop': 'At the stop now',
      'to_school': 'On board — riding to school', 'at_school': 'Arrived at school',
      'from_school': 'On board — riding home', 'to_home': 'Bus on the way home',
      'home': 'Home'}.get(stage, '') }}
    detail: "{% if stage in ['to_stop', 'to_home'] %}{{ dist }} miles away · {{ 'arriving any moment' if mins <= 0 else mins ~ ' min' }} · due {{ due }}{% elif stage == 'to_school' %}{{ 'Arriving at school any moment' if mins <= 0 else mins ~ ' min to school' }}{% elif stage == 'from_school' %}{{ dist }} miles from home · {{ 'arriving any moment' if mins <= 0 else mins ~ ' min' }}{% elif stage == 'at_stop' %}The bus has arrived — time to board{% elif stage == 'at_school' %}Dropped off safely{% elif stage == 'home' %}The bus is at the stop now{% endif %}"
    colour: >-
      {{ {'to_stop': '#FFC72C', 'to_home': '#FFC72C', 'at_stop': '#4CAF50',
      'to_school': '#4CAF50', 'from_school': '#4CAF50', 'at_school': '#2196F3',
      'home': '#2196F3'}.get(stage, '#4CAF50') }}
    glyph: >-
      {{ {'to_stop': 'mdi:bus-school', 'to_home': 'mdi:bus-school',
      'at_stop': 'mdi:bus-stop', 'to_school': 'mdi:bus-school',
      'from_school': 'mdi:bus-school', 'at_school': 'mdi:school',
      'home': 'mdi:home'}.get(stage, 'mdi:bus-school') }}
  triggers:
    - trigger: state
      entity_id: sensor.RIDER_journey
      id: stage
    # Refreshes the bar and the countdown mid-stage. Five minutes, not every
    # poll: iOS throttles frequent updates, and more importantly it caps how
    # often a NEW activity may be started by push. Exceed that and starts fail
    # SILENTLY — and because a failed start means the next push is also a
    # start, it never recovers on its own.
    - trigger: time_pattern
      minutes: /5
      id: tick
    # A chronometer wound to a time still ahead counts DOWN to it, then keeps
    # going UPWARD once it passes. The five-minute refresh normally corrects
    # that and the journey ending clears the card — but Home Assistant
    # restarting through both leaves the last push on the phone, ticking
    # upward with nobody minding it. An activity that survived a restart is by
    # definition describing a journey nothing is watching any more.
    - trigger: homeassistant
      event: start
      id: startup
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  actions:
    - choose:
        - alias: Home Assistant restarted — retire anything left running
          conditions:
            - condition: trigger
              id: startup
          sequence:
            - action: NOTIFY_TARGET
              data:
                message: clear_notification
                data:
                  tag: "{{ now().strftime('%Y%m%d') }}-{{ 'am' if now().hour < 12 else 'pm' }}"

        - alias: The journey ended — clear the activity it was driving
          conditions:
            - condition: trigger
              id: stage
            - condition: state
              entity_id: sensor.RIDER_journey
              state: idle
            # The id of the journey that just finished travels on the old
            # state, so no fixed-time backstop or date arithmetic is needed.
            - condition: template
              value_template: "{{ trigger.from_state is not none and trigger.from_state.attributes.get('journey_id') }}"
          sequence:
            - action: NOTIFY_TARGET
              data:
                message: clear_notification
                data:
                  tag: "{{ trigger.from_state.attributes.journey_id }}"

        - alias: A journey is under way — show where it has got to
          conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: sensor.RIDER_journey
                  state: [idle, unknown, unavailable]
          sequence:
            - action: NOTIFY_TARGET
              data:
                title: "{{ title }}"
                message: "{{ detail }}"
                data:
                  tag: "{{ jid }}"
                  live_update: true
                  # A chronometer left running past its target counts UPWARD,
                  # turning a late bus into a growing "1:40:51".
                  chronometer: "{{ target is not none and mins > 0 }}"
                  # Only ever wound to a target still AHEAD. Wound to one
                  # already past, a chronometer counts upward.
                  when: "{{ (target | as_timestamp | int) if (target and mins > 0) else (as_timestamp(now()) | int) }}"
                  progress: "{{ progress if progress is not none else 0 }}"
                  progress_max: 100
                  notification_icon: "{{ glyph }}"
                  notification_icon_color: "{{ colour }}"
                  color: "{{ colour }}"
                  # url travels per update, so it repeats on every push.
                  url: /school-bus/overview
                  clickAction: /school-bus/overview
                  push:
                    interruption-level: time-sensitive

# ---------------------------------------------------------------------------
# 6. Live Activities break silently after a companion app update
# ---------------------------------------------------------------------------
# Live Activities use a different push token from ordinary notifications. An
# app update invalidates it and leaves the ordinary one working, so the banner
# alerts above keep arriving while the Live Activity quietly stops — which
# looks exactly like a broken automation and is not one. Watching the app
# version turns a multi-day outage into a one-minute chore.
#
# Replace PHONE with the companion app's device slug, e.g. sensor.janes_iphone_app_version.
- id: wtb_live_activity_resync_reminder
  alias: School bus — re-sync Live Activities after an app update
  mode: single
  triggers:
    # not_from/not_to rather than a template condition: the entity coming back
    # from unavailable on a restart is not an app update, and the native form
    # is validated when the config loads instead of failing silently at runtime.
    - trigger: state
      entity_id: sensor.PHONE_app_version
      not_from: [unknown, unavailable]
      not_to: [unknown, unavailable]
  actions:
    - action: NOTIFY_TARGET
      data:
        title: Companion app updated
        message: >-
          Now {{ trigger.to_state.state }} (was {{ trigger.from_state.state }}).
          Open the app and re-sync Live Activities, or the bus activity will
          stop appearing while ordinary alerts keep working.
        data:
          url: /school-bus/overview
          clickAction: /school-bus/overview

# WheresTheBus — example dashboard
#
# Four views: an at-a-glance Overview, a full-screen Map, History, and a
# Predictions page explaining where the estimated arrival time comes from.
#
# Replace every RIDER with your rider's entity slug. Find it under
# Settings > Devices & Services > WheresTheBus, on the rider's device: entity
# ids look like sensor.jane_smith_next_arrival, so RIDER would be jane_smith.
#
#   sed -i '' 's/RIDER/jane_smith/g' dashboard.yaml
#
# To install: Settings > Dashboards > Add dashboard > New dashboard from
# scratch. Open it, then three-dots > Raw configuration editor, and paste
# everything below this header.
#
# Needs Home Assistant 2024.11+ for sections views and grid_options.

views:
- title: Overview
  path: overview
  icon: mdi:bus-school
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.RIDER_next_arrival
    show_name: true
    name: Next
  - type: entity
    entity: sensor.RIDER_bus_status
    show_name: true
    name: GPS
  - type: entity
    entity: sensor.RIDER_distance_to_stop
    show_name: true
    name: To stop
  - type: entity
    entity: sensor.RIDER_bus_number
    show_name: true
    name: Bus
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Where is the bus
      heading_style: title
      icon: mdi:map-marker-radius
    - type: map
      entities:
      - device_tracker.RIDER_bus
      auto_fit: true
      theme_mode: auto
      hours_to_show: 3
      grid_options:
        columns: full
        rows: 6
    - type: tile
      entity: sensor.RIDER_next_arrival
      name: Next arrival
      icon: mdi:bus-clock
      grid_options:
        columns: full
    - type: markdown
      text_only: true
      content: '{% set s = ''sensor.RIDER_next_arrival'' %}{% set n = state_attr(s, ''samples'') %}{%
        set run = ''Morning'' if state_attr(s, ''run'') == ''am'' else ''Afternoon'' %}{% if state_attr(s,
        ''prediction_source'') == ''learned'' %}{{ run }} run, learned from {{ n }} observed arrival{{
        '''' if n == 1 else ''s'' }}.{% else %}{{ run }} run, using the {{ state_attr(s, ''scheduled'')
        }} timetable — no arrivals observed for this run yet.{% endif %}'
      grid_options:
        columns: full
        rows: auto
    - type: tile
      entity: sensor.RIDER_distance_to_stop
      name: Distance to stop
      icon: mdi:map-marker-distance
      features:
      - type: trend-graph
        hours_to_show: 6
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.RIDER_bus_status
      name: GPS status
      icon: mdi:crosshairs-gps
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.RIDER_gps_age
      name: GPS age
      icon: mdi:crosshairs-gps
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.RIDER_eta
        state_not: unknown
      - condition: state
        entity: sensor.RIDER_eta
        state_not: unavailable
      card:
        type: tile
        entity: sensor.RIDER_eta
        name: ETA
        icon: mdi:clock-fast
  - type: grid
    cards:
    - type: heading
      heading: Today's ID scans
      heading_style: title
      icon: mdi:card-account-details-outline
    - type: markdown
      content: '{% set p = ''sensor.RIDER_last_pickup'' %}{% set d = ''sensor.RIDER_last_drop_off'' %}{%
        set bad = [''unknown'',''unavailable'',''none''] %}**Picked up**

        {% if states(p) not in bad %}{{ (states(p)|as_datetime|as_local).strftime(''%-I:%M %p'') }} at
        {{ state_attr(p,''scan_location'') }}{% else %}No scan yet today{% endif %}


        **Dropped off**

        {% if states(d) not in bad %}{{ (states(d)|as_datetime|as_local).strftime(''%-I:%M %p'') }} at
        {{ state_attr(d,''scan_location'') }}{% else %}No scan yet today{% endif %}'
      grid_options:
        columns: full
        rows: auto
    - type: tile
      entity: sensor.RIDER_last_pickup
      name: Last pickup
      icon: mdi:bus-marker
      grid_options:
        columns: full
    - type: tile
      entity: sensor.RIDER_last_drop_off
      name: Last drop-off
      icon: mdi:bus-stop
      grid_options:
        columns: full
    - type: tile
      entity: sensor.RIDER_last_scan
      name: Most recent scan
      icon: mdi:card-account-details-outline
      grid_options:
        columns: full
    - type: heading
      heading: Scans are boarding + school arrival only — there is no scan when stepping off at home,
        and all three reset after midnight.
      heading_style: subtitle
      icon: mdi:information-outline
  - type: grid
    cards:
    - type: heading
      heading: Schedule
      heading_style: title
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.RIDER_morning_stop_time
      name: Morning stop
      icon: mdi:weather-sunset-up
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.RIDER_afternoon_stop_time
      name: Afternoon stop
      icon: mdi:weather-sunset-down
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.RIDER_bus_number
      name: Bus number
      icon: mdi:bus
      grid_options:
        columns: full
- title: Map
  path: map
  icon: mdi:map-marker-radius
  type: panel
  cards:
  - type: map
    entities:
    - device_tracker.RIDER_bus
    auto_fit: true
    theme_mode: auto
    hours_to_show: 12
- title: History
  path: history
  icon: mdi:chart-line
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Distance to stop
      heading_style: title
      icon: mdi:chart-line
    - type: history-graph
      hours_to_show: 24
      entities:
      - entity: sensor.RIDER_distance_to_stop
        name: Distance to stop
        color: '#f9a825'
      grid_options:
        columns: full
        rows: 4
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Scan and bus activity
      heading_style: title
      icon: mdi:format-list-bulleted
    - type: logbook
      hours_to_show: 48
      target:
        entity_id:
        - sensor.RIDER_last_pickup
        - sensor.RIDER_last_drop_off
        - device_tracker.RIDER_bus
      grid_options:
        columns: full
        rows: 5
- title: Predictions
  path: predictions
  icon: mdi:chart-bell-curve
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Next arrival
      heading_style: title
      icon: mdi:bus-clock
    - type: tile
      entity: sensor.RIDER_next_arrival
      name: Predicted arrival
      icon: mdi:bus-clock
      grid_options:
        columns: full
    - type: markdown
      content: '{% set s = ''sensor.RIDER_next_arrival'' %}{% set p = states(s) | as_datetime | as_local
        %}{% set sched = state_attr(s, ''scheduled'') %}{% set n = state_attr(s, ''samples'') %}{% set
        spread = state_attr(s, ''spread_minutes'') %}{% set out = state_attr(s, ''outliers_excluded'')
        %}{% set learned = state_attr(s, ''prediction_source'') == ''learned'' %}{% set sh = sched.split('':'')[0]
        | int %}{% set sm = sched.split('':'')[1] | int %}{% set delta = (p.hour * 60 + p.minute) - (sh
        * 60 + sm) %}

        | | |

        |---|---|

        | Run | {{ ''Morning pickup'' if state_attr(s, ''run'') == ''am'' else ''Afternoon drop-off''
        }} |

        | Predicted | **{{ p.strftime(''%-I:%M %p'') }}** |

        | District timetable | {{ sched }} |

        | Difference | {% if delta > 0 %}{{ delta }} min later than timetable{% elif delta < 0 %}{{ delta
        * -1 }} min earlier than timetable{% else %}exactly on the timetable{% endif %} |

        | Basis | {% if learned %}Median of {{ n }} observed arrival{{ '''' if n == 1 else ''s'' }}{%
        else %}Timetable only — no arrival observed for this run yet{% endif %} |

        | Observed spread | {% if learned and spread is not none %}{{ spread }} min between earliest and
        latest{% else %}—{% endif %} |

        | Late days excluded | {{ out if out is not none else 0 }} |

        {% if learned and n < 3 %}

        > Only {{ n }} sample{{ '''' if n == 1 else ''s'' }} so far, so treat the time as approximate.
        Outlier rejection needs three before it can judge which day is the odd one.

        {% endif %}'
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: How this is worked out
      heading_style: title
      icon: mdi:function-variant
    - type: markdown
      content: '**Where the time comes from.** Each run keeps its own history of when the bus actually
        reached the stop, and the prediction is the **median** of those, not the most recent. A median
        is used rather than a mean so one bus stuck behind a train cannot drag tomorrow''s estimate with
        it. Until any arrival has been seen, the district timetable is used and this page says so.


        **What counts as an arrival.** Only a pass that comes within **0.3 miles** of the stop, **inside
        30 minutes** of the scheduled time. Both filters matter. Buses routinely pass a stop on unrelated
        earlier routes, and on a run where nobody boards the route can stay half a mile out without ever
        stopping.


        **Bad days are set aside.** An arrival more than three scaled deviations from the median is excluded
        from the calculation but kept in history, so a genuine timetable change is still learned once
        the new times outnumber the old. The cutoff never tightens below 12 minutes, otherwise a run that
        clusters inside two minutes would reject an ordinary five-minute delay as anomalous.


        **Roughly six school weeks** of arrivals are kept per run, morning and afternoon counted separately.


        *Spread and excluded-day figures need the integration at 1.3.0 or later; older versions show a
        dash.*'
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: The evidence behind it
      heading_style: title
      icon: mdi:chart-line
    - type: heading
      heading: Each dip to zero inside the schedule window is one learned arrival.
      heading_style: subtitle
      icon: mdi:information-outline
    - type: history-graph
      hours_to_show: 36
      entities:
      - entity: sensor.RIDER_distance_to_stop
        name: Distance to stop
        color: '#f9a825'
      grid_options:
        columns: full
        rows: 4
    - type: logbook
      hours_to_show: 96
      target:
        entity_id:
        - sensor.RIDER_last_pickup
        - sensor.RIDER_last_drop_off
      grid_options:
        columns: full
        rows: 5
